plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group 'com.domainawakeningmod'
version '1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://files.minecraftforge.net/maven'
    }
}

sourceCompatibility = JavaVersion.VERSION_17

forge {
    version = '47.1.0'
    runs {
        client {
            property 'forge.logging.markers', 'REGISTRIES'
        }
        server {
            property 'forge.logging.markers', 'REGISTRIES'
        }
    }
}

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.20.1-47.1.0')
    implementation fg.deobf('net.minecraft:client:1.20.1-20230807.111420')
    implementation fg.deobf('net.minecraft:server:1.20.1-20230807.111420')
}
